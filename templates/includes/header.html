      <ul class='navbar-nav me-auto'>

        <li class='nav-item'><a class='nav-link text-light' href='{% url "main:promotions" %}'>Акции</a></li>

<div class="bg-dark border-bottom border-secondary py-2">
  <div class="container d-flex flex-wrap gap-2 justify-content-between align-items-center">
    <span class='text-light'>Ваш автомобиль: <strong class='text-danger'>{{ selected_vehicle|default:"не выбран" }}</strong></span>
    <form method="post" action="{% url 'catalog:vehicle_select' %}" class="d-flex gap-2 flex-wrap">
      {% csrf_token %}
      <input name="engine" type="number" min="1" class="form-control form-control-sm" style="max-width:180px" placeholder="ID двигателя">
      <button class="btn btn-sm btn-danger" type="submit">Сохранить авто</button>
      <a href="{% url 'catalog:vehicle_clear' %}" class="btn btn-sm btn-outline-light">Сброс</a>
    </form>
  </div>
