{% extends 'base.html' %}{% block content %}<h1>Каталог</h1><form class='row g-2 mb-3'><div class='col'><input name='q' class='form-control' placeholder='Поиск'></div><div class='col'><button class='btn btn-danger'>Найти</button></div></form><div class='row'>{% for p in page_obj %}<div class='col-md-3'><div class='card product-card'><div class='card-body'><a href='{{p.get_absolute_url}}' class='text-light'>{{p.name}}</a><div>{{p.price}} ₽</div><a href='/cart/add/{{p.id}}/' class='btn btn-sm btn-outline-danger mt-2'>В корзину</a></div></div></div>{% endfor %}</div>{% endblock %}
