{% load static %}
<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='description' content='Интернет-магазин автозапчастей Автомир, Апшеронск'><title>{% block title %}Автомир{% endblock %}</title><link rel='icon' href='{% static "img/favicon.ico" %}'><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css' rel='stylesheet'><link rel='stylesheet' href='{% static "css/style.css" %}'></head><body>
{% include 'includes/header.html' %}
<main class='container py-4'>{% for m in messages %}<div class='alert alert-success'>{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main>
{% include 'includes/footer.html' %}
<script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script><script src='{% static "js/main.js" %}'></script></body></html>
