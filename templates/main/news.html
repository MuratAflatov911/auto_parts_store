{% extends 'base.html' %}
{% block content %}
<h1 class="mb-4">Новости</h1>
<div class="row g-3">
{% for item in news_list %}
  <div class="col-md-6">
    <div class="card product-card h-100"><div class="card-body">
      <h5>{{ item.title }}</h5>
      <p class="text-secondary small">{{ item.created_at|date:"d.m.Y H:i" }}</p>
      <p>{{ item.content|truncatechars:220 }}</p>
    </div></div>
  </div>
{% empty %}
  <p>Новостей пока нет.</p>
{% endfor %}
</div>
{% endblock %}
